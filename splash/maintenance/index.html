<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MyPrintRequest.com is temporarily under maintenance. We'll be back shortly."
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050508" />
    <title>MyPrintRequest — Under Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="theme-maintenance">
    <div class="atmosphere" aria-hidden="true">
      <div class="orb orb-pink"></div>
      <div class="orb orb-cyan"></div>
      <div class="orb orb-yellow"></div>
      <div class="grid"></div>
      <div class="scanlines"></div>
      <div class="vignette"></div>
      <div class="cursor-glow" id="cursor-glow"></div>
    </div>

    <main class="stage">
      <div class="brand">
        <img
          class="logo"
          src="assets/fresh-prints-request-portal-logo.png"
          width="1200"
          height="484"
          alt="Fresh Prints Request Portal"
        />
      </div>

      <h1 class="headline">Under Maintenance</h1>
      <p class="lede">
        We're doing a quick tune-up behind the scenes. Hang tight — we'll be
        back shortly.
      </p>

      <p class="domain">myprintrequest.com</p>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
