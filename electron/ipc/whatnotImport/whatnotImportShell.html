<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Import Whatnot shows</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0d12;
        color: #e8eaed;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
      }

      #panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 16px;
        gap: 12px;
        overflow: hidden;
      }

      h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
      }

      #hint {
        color: #9aa0a6;
        line-height: 1.4;
        margin: 0;
      }

      #error {
        display: none;
        color: #f28b82;
        background: rgba(242, 139, 130, 0.1);
        border: 1px solid rgba(242, 139, 130, 0.3);
        border-radius: 8px;
        padding: 8px 10px;
      }

      button {
        font: inherit;
        cursor: pointer;
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        font-weight: 600;
      }

      #scan-button {
        background: #4c8dff;
        color: #fff;
      }

      #scan-button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      #results {
        flex: 1 1 auto;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
      }

      .entry {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.03);
      }

      .entry label {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        flex: 1 1 auto;
        min-width: 0;
      }

      .entry-title {
        font-weight: 600;
      }

      .entry-meta {
        color: #9aa0a6;
      }

      #unchanged-summary {
        display: none;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.03);
      }

      #unchanged-summary-toggle {
        background: none;
        border: none;
        padding: 0;
        color: #8ab4f8;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        text-decoration: underline;
      }

      #unchanged-list {
        display: none;
        flex-direction: column;
        gap: 6px;
        margin-top: 8px;
      }

      #unchanged-list .entry-title {
        font-weight: 400;
        color: #9aa0a6;
      }

      .badge {
        flex: 0 0 auto;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        border: 1px solid transparent;
      }

      .badge-create {
        color: #81c995;
        border-color: rgba(129, 201, 149, 0.4);
      }

      .badge-update {
        color: #8ab4f8;
        border-color: rgba(138, 180, 248, 0.4);
      }

      .badge-unchanged {
        color: #9aa0a6;
        border-color: rgba(154, 160, 166, 0.4);
      }

      .badge-needs_review {
        color: #fdd663;
        border-color: rgba(253, 214, 99, 0.4);
      }

      .badge-live {
        color: #f28b82;
        border-color: rgba(242, 139, 130, 0.4);
      }

      .badge-ignore {
        color: #9aa0a6;
        border-color: rgba(154, 160, 166, 0.4);
      }

      #footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      #cancel-button {
        background: transparent;
        color: #9aa0a6;
      }

      #confirm-button {
        background: #4c8dff;
        color: #fff;
      }

      #confirm-button:disabled,
      #cancel-button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      #empty-state {
        display: none;
        color: #9aa0a6;
        text-align: center;
        padding: 24px 8px;
      }

      /* Styled scrollbar for the results list (Chromium-based renderer). */
      #results::-webkit-scrollbar {
        width: 8px;
      }

      #results::-webkit-scrollbar-track {
        background: transparent;
      }

      #results::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 999px;
      }

      #results::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>Import Whatnot shows</h1>
      <p id="hint">Let the Whatnot page finish loading on the left (and complete any verification it shows you), then scan for visible shows.</p>
      <p id="error"></p>
      <button id="scan-button" type="button">Scan visible shows</button>
      <div id="empty-state">No shows were found on the open Whatnot page.</div>
      <div id="unchanged-summary">
        <button id="unchanged-summary-toggle" type="button"></button>
        <div id="unchanged-list"></div>
      </div>
      <div id="results"></div>
      <div id="footer">
        <button id="cancel-button" type="button">Cancel</button>
        <button id="confirm-button" type="button" disabled>Confirm import</button>
      </div>
    </div>
    <script src="whatnotImportShellRenderer.js"></script>
  </body>
</html>
