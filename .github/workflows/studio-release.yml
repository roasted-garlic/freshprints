name: Studio release

# Manual trigger only. Never runs on push/PR — stable publication requires a human to press
# "Run workflow" with an explicit stable choice against production, then separately publish the draft.
#
# Topology (Studio 1.0.4+):
#   build-windows  → Windows NSIS + latest.yml (publish never)
#   build-macos    → Mac x64 + arm64 DMG+ZIP (publish never), merged latest-mac.yml
#   finalize-release →
#     - ALWAYS verifies dual-platform + dual-arch artifacts (same SHA)
#     - Mutates a GitHub Release DRAFT ONLY when release_type=stable AND the built SHA is
#       reachable from origin/production (post-merge). Branch/prerelease runs are validation-only
#       and must never create or mutate releases.
# Concurrent electron-builder GitHub publish from platform jobs is intentionally avoided
# (platform jobs use --publish never; finalize attaches assets once, stable only).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build from (branch, tag, or commit SHA). Branch refs are validation-only (no GitHub Release mutation)."
        required: true
      release_type:
        description: "prerelease = packaging validation only (never mutates GitHub Releases). stable = may create/update a DRAFT only when the built SHA is on production."
        required: true
        type: choice
        options:
          - prerelease
          - stable
        default: prerelease
      distribution_mode:
        description: "Stable distribution mode (ignored for prerelease, which always builds unsigned): 'signed' requires Windows signing credentials for Windows artifacts and is intended for public/external Windows distribution; Mac Studio 1.0.4 is internal-unsigned only (Gatekeeper friction expected; Apple Developer ID / notarization deferred). 'internal-unsigned' is an explicit, owner-approved exception for internal-only staff installs on both platforms."
        required: true
        type: choice
        options:
          - signed
          - internal-unsigned
        default: signed

permissions:
  contents: write

env:
  STUDIO_NODE_VERSION: "20"

jobs:
  build-windows:
    name: build-windows
    runs-on: windows-latest
    outputs:
      build_sha: ${{ steps.record_sha.outputs.build_sha }}
      studio_version: ${{ steps.record_sha.outputs.studio_version }}
    steps:
      - name: Guard stable release ref
        if: ${{ inputs.release_type == 'stable' }}
        shell: bash
        run: |
          if [ "${{ inputs.ref }}" != "production" ] && [[ ! "${{ inputs.ref }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Stable releases may only be built from the production branch or an exact production commit SHA. Got: ${{ inputs.ref }}"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify ref is reachable from production (stable only)
        if: ${{ inputs.release_type == 'stable' }}
        shell: bash
        run: |
          git fetch origin production --depth=1000
          if ! git merge-base --is-ancestor HEAD origin/production; then
            echo "::error::The requested ref is not part of production history. Refusing to publish a stable release from it."
            exit 1
          fi

      - name: Record build SHA and Studio version
        id: record_sha
        shell: bash
        run: |
          echo "build_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "studio_version=$(node -p "require('./apps/studio/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.STUDIO_NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Set Studio release channel env
        shell: bash
        run: |
          if [ "${{ inputs.release_type }}" = "stable" ]; then
            echo "FRESH_PRINTS_UPDATE_CHANNEL=stable" >> "$GITHUB_ENV"
          else
            echo "FRESH_PRINTS_UPDATE_CHANNEL=prerelease" >> "$GITHUB_ENV"
          fi

      - name: Generate Studio packaged build config
        working-directory: apps/studio
        run: node scripts/generate-packaged-build-config.mjs

      - name: Lint
        run: npm run lint

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Typecheck Portal
        run: npm run typecheck --workspace @fresh-prints/portal

      - name: Studio updater unit tests
        run: npx tsx --test packages/shared/src/studioUpdate/studioUpdateStateTransitions.test.ts packages/shared/src/studioUpdate/studioUpdateErrorMapping.test.ts apps/studio/electron/ipc/studioUpdate/studioUpdateChannel.test.ts apps/studio/electron/ipc/studioUpdate/studioUpdateIpcChannels.test.ts apps/studio/scripts/generate-packaged-build-config.test.ts apps/studio/scripts/merge-latest-mac-yml.test.ts

      - name: Configure Studio Firebase + Algolia environment
        working-directory: apps/studio
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          DEV_FIREBASE_API_KEY: ${{ secrets.DEV_FIREBASE_API_KEY }}
          DEV_FIREBASE_AUTH_DOMAIN: ${{ secrets.DEV_FIREBASE_AUTH_DOMAIN }}
          DEV_FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          DEV_FIREBASE_STORAGE_BUCKET: ${{ secrets.DEV_FIREBASE_STORAGE_BUCKET }}
          DEV_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DEV_FIREBASE_MESSAGING_SENDER_ID }}
          DEV_FIREBASE_APP_ID: ${{ secrets.DEV_FIREBASE_APP_ID }}
          PROD_FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
          PROD_FIREBASE_AUTH_DOMAIN: ${{ secrets.PROD_FIREBASE_AUTH_DOMAIN }}
          PROD_FIREBASE_PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
          PROD_FIREBASE_STORAGE_BUCKET: ${{ secrets.PROD_FIREBASE_STORAGE_BUCKET }}
          PROD_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PROD_FIREBASE_MESSAGING_SENDER_ID }}
          PROD_FIREBASE_APP_ID: ${{ secrets.PROD_FIREBASE_APP_ID }}
          DEV_ALGOLIA_APP_ID: ${{ secrets.DEV_ALGOLIA_APP_ID }}
          DEV_ALGOLIA_SEARCH_API_KEY: ${{ secrets.DEV_ALGOLIA_SEARCH_API_KEY }}
          DEV_ALGOLIA_INDEX_NAME: ${{ secrets.DEV_ALGOLIA_INDEX_NAME }}
          PROD_ALGOLIA_APP_ID: ${{ secrets.PROD_ALGOLIA_APP_ID }}
          PROD_ALGOLIA_SEARCH_API_KEY: ${{ secrets.PROD_ALGOLIA_SEARCH_API_KEY }}
          PROD_ALGOLIA_INDEX_NAME: ${{ secrets.PROD_ALGOLIA_INDEX_NAME }}
        run: node scripts/write-studio-release-env.mjs

      - name: Configure optional Windows signing
        shell: pwsh
        env:
          WINDOWS_CSC_LINK_SECRET: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          DISTRIBUTION_MODE: ${{ inputs.distribution_mode }}
        run: |
          $hasLink = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_LINK_SECRET)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_KEY_PASSWORD_SECRET)

          if ($hasLink -xor $hasPassword) {
            Write-Error "Windows signing configuration is incomplete: both WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD secrets must be set together, or neither."
            exit 1
          }

          if ($hasLink -and $hasPassword) {
            "WIN_CSC_LINK=$($env:WINDOWS_CSC_LINK_SECRET)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "WIN_CSC_KEY_PASSWORD=$($env:WINDOWS_CSC_KEY_PASSWORD_SECRET)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Windows signing credentials configured."
            exit 0
          }

          if ($env:RELEASE_TYPE -ne "stable") {
            Write-Host "No Windows signing credentials configured; building unsigned prerelease."
            exit 0
          }

          if ($env:DISTRIBUTION_MODE -eq "internal-unsigned") {
            Write-Warning "INTERNAL-UNSIGNED STABLE BUILD (Windows): this installer is NOT code-signed and is approved only for internal, owner-controlled staff distribution. It is NOT suitable for public release and will trigger Windows SmartScreen warnings on install."
            exit 0
          }

          Write-Error "Stable Studio Windows releases require Windows signing credentials (WINDOWS_CSC_LINK + WINDOWS_CSC_KEY_PASSWORD secrets), or explicit selection of distribution_mode: internal-unsigned for an owner-approved internal-only exception."
          exit 1

      - name: Build Studio (Windows NSIS + updater metadata, no publish)
        working-directory: apps/studio
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Compile once, then retry packaging only. Windows CI has intermittently failed with:
          #   Get ".../nsis-resources-3.4.1.7z": EOF
          #   ERR_ELECTRON_BUILDER_CANNOT_EXECUTE
          # while already building Fresh-Prints-Windows-*-Setup.exe (not a naming/config regression).
          node scripts/generate-packaged-build-config.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx vite build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $cacheRoot = Join-Path $env:LOCALAPPDATA "electron-builder\Cache\nsis"
          New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null
          $prefetch = @(
            @{
              File = "nsis-3.0.4.1.7z"
              Url  = "https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z"
              Dir  = "nsis-3.0.4.1"
            },
            @{
              File = "nsis-resources-3.4.1.7z"
              Url  = "https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-resources-3.4.1/nsis-resources-3.4.1.7z"
              Dir  = "nsis-resources-3.4.1"
            }
          )
          $sevenZip = @(
            "${env:ProgramFiles}\7-Zip\7z.exe",
            "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          foreach ($asset in $prefetch) {
            $destDir = Join-Path $cacheRoot $asset.Dir
            if (Test-Path $destDir) {
              Write-Host "NSIS cache hit: $($asset.Dir)"
              continue
            }
            $archive = Join-Path $cacheRoot $asset.File
            Write-Host "Prefetching $($asset.File) with curl retries"
            & curl.exe -fsSL --retry 8 --retry-all-errors --retry-delay 5 -o $archive $asset.Url
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Prefetch download failed for $($asset.File); electron-builder retry loop may still succeed"
              continue
            }
            New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            if ($sevenZip) {
              & $sevenZip x -y "-o$destDir" $archive | Out-Host
            } else {
              # Fallback: leave archive for electron-builder; also try tar if the runner can read 7z.
              Write-Host "7-Zip not found; leaving archive at $archive for electron-builder download cache"
            }
          }

          $attempt = 0
          $maxAttempts = 3
          while ($attempt -lt $maxAttempts) {
            $attempt++
            Write-Host "electron-builder Windows attempt $attempt of $maxAttempts"
            npx electron-builder --win --x64 --publish never
            if ($LASTEXITCODE -eq 0) {
              Write-Host "electron-builder Windows OK on attempt $attempt"
              exit 0
            }
            Write-Warning "electron-builder Windows failed on attempt $attempt (exit=$LASTEXITCODE)"
            if ($attempt -ge $maxAttempts) {
              Write-Error "electron-builder Windows failed after $maxAttempts attempts (often nsis-resources download EOF)"
              exit 1
            }
            Start-Sleep -Seconds (20 * $attempt)
          }

      - name: Verify Windows release artifacts
        shell: bash
        working-directory: apps/studio/release
        run: |
          set -euo pipefail
          version_dir=$(ls -d */ | head -n1)
          VERSION=$(basename "$version_dir")
          cd "$version_dir"
          installer="Fresh-Prints-Windows-${VERSION}-Setup.exe"
          test -f "$installer"
          test -f "${installer}.blockmap"
          test -f latest.yml
          if grep -q ' ' <<<"$installer"; then
            echo "::error::Windows installer name must not contain spaces (GitHub Release turns spaces into dots)."
            exit 1
          fi
          # latest.yml path must match the on-disk installer name exactly.
          yml_path=$(node -e "const t=require('fs').readFileSync('latest.yml','utf8'); const m=t.match(/^path:\\s*(.+)$/m); process.stdout.write(m?m[1].trim():'')")
          if [ "$yml_path" != "$installer" ]; then
            echo "::error::latest.yml path '$yml_path' does not match installer '$installer'"
            exit 1
          fi
          sha256sum "$installer" | tee sha256-windows.txt
          echo "Windows artifacts OK: $installer"

      - name: Upload Windows package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studio-windows-${{ github.run_id }}
          path: |
            apps/studio/release/**
          retention-days: 14
          if-no-files-found: error

  build-macos:
    name: build-macos
    runs-on: macos-latest
    outputs:
      build_sha: ${{ steps.record_sha.outputs.build_sha }}
      studio_version: ${{ steps.record_sha.outputs.studio_version }}
    steps:
      - name: Guard stable release ref
        if: ${{ inputs.release_type == 'stable' }}
        shell: bash
        run: |
          if [ "${{ inputs.ref }}" != "production" ] && [[ ! "${{ inputs.ref }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Stable releases may only be built from the production branch or an exact production commit SHA. Got: ${{ inputs.ref }}"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify ref is reachable from production (stable only)
        if: ${{ inputs.release_type == 'stable' }}
        shell: bash
        run: |
          git fetch origin production --depth=1000
          if ! git merge-base --is-ancestor HEAD origin/production; then
            echo "::error::The requested ref is not part of production history. Refusing to publish a stable release from it."
            exit 1
          fi

      - name: Record build SHA and Studio version
        id: record_sha
        shell: bash
        run: |
          echo "build_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "studio_version=$(node -p "require('./apps/studio/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.STUDIO_NODE_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Set Studio release channel env
        shell: bash
        run: |
          if [ "${{ inputs.release_type }}" = "stable" ]; then
            echo "FRESH_PRINTS_UPDATE_CHANNEL=stable" >> "$GITHUB_ENV"
          else
            echo "FRESH_PRINTS_UPDATE_CHANNEL=prerelease" >> "$GITHUB_ENV"
          fi

      - name: Generate Studio packaged build config
        working-directory: apps/studio
        run: node scripts/generate-packaged-build-config.mjs

      - name: Lint
        run: npm run lint

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Typecheck Portal
        run: npm run typecheck --workspace @fresh-prints/portal

      - name: Studio updater unit tests
        run: npx tsx --test packages/shared/src/studioUpdate/studioUpdateStateTransitions.test.ts packages/shared/src/studioUpdate/studioUpdateErrorMapping.test.ts apps/studio/electron/ipc/studioUpdate/studioUpdateChannel.test.ts apps/studio/electron/ipc/studioUpdate/studioUpdateIpcChannels.test.ts apps/studio/scripts/generate-packaged-build-config.test.ts apps/studio/scripts/merge-latest-mac-yml.test.ts

      - name: Configure Studio Firebase + Algolia environment
        working-directory: apps/studio
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          DEV_FIREBASE_API_KEY: ${{ secrets.DEV_FIREBASE_API_KEY }}
          DEV_FIREBASE_AUTH_DOMAIN: ${{ secrets.DEV_FIREBASE_AUTH_DOMAIN }}
          DEV_FIREBASE_PROJECT_ID: ${{ secrets.DEV_FIREBASE_PROJECT_ID }}
          DEV_FIREBASE_STORAGE_BUCKET: ${{ secrets.DEV_FIREBASE_STORAGE_BUCKET }}
          DEV_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.DEV_FIREBASE_MESSAGING_SENDER_ID }}
          DEV_FIREBASE_APP_ID: ${{ secrets.DEV_FIREBASE_APP_ID }}
          PROD_FIREBASE_API_KEY: ${{ secrets.PROD_FIREBASE_API_KEY }}
          PROD_FIREBASE_AUTH_DOMAIN: ${{ secrets.PROD_FIREBASE_AUTH_DOMAIN }}
          PROD_FIREBASE_PROJECT_ID: ${{ secrets.PROD_FIREBASE_PROJECT_ID }}
          PROD_FIREBASE_STORAGE_BUCKET: ${{ secrets.PROD_FIREBASE_STORAGE_BUCKET }}
          PROD_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PROD_FIREBASE_MESSAGING_SENDER_ID }}
          PROD_FIREBASE_APP_ID: ${{ secrets.PROD_FIREBASE_APP_ID }}
          DEV_ALGOLIA_APP_ID: ${{ secrets.DEV_ALGOLIA_APP_ID }}
          DEV_ALGOLIA_SEARCH_API_KEY: ${{ secrets.DEV_ALGOLIA_SEARCH_API_KEY }}
          DEV_ALGOLIA_INDEX_NAME: ${{ secrets.DEV_ALGOLIA_INDEX_NAME }}
          PROD_ALGOLIA_APP_ID: ${{ secrets.PROD_ALGOLIA_APP_ID }}
          PROD_ALGOLIA_SEARCH_API_KEY: ${{ secrets.PROD_ALGOLIA_SEARCH_API_KEY }}
          PROD_ALGOLIA_INDEX_NAME: ${{ secrets.PROD_ALGOLIA_INDEX_NAME }}
        run: node scripts/write-studio-release-env.mjs

      - name: Configure Mac internal-unsigned (ad-hoc) distribution policy
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          DISTRIBUTION_MODE: ${{ inputs.distribution_mode }}
        run: |
          set -euo pipefail
          # Do not auto-discover Apple Developer ID identities for Studio 1.0.4 Mac.
          # Packaging uses electron-builder mac.identity="-" (ad-hoc) — not Developer ID / notarization.
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          if [ "$RELEASE_TYPE" != "stable" ]; then
            echo "Building internal Mac prerelease/validation with ad-hoc codesign (no Apple Developer ID / notarization)."
            exit 0
          fi
          if [ "$DISTRIBUTION_MODE" = "internal-unsigned" ]; then
            echo "::warning::INTERNAL-UNSIGNED STABLE BUILD (Mac x64+arm64): packages are ad-hoc signed (structurally valid) but NOT Developer ID signed and NOT notarized. Gatekeeper will treat them as unverified — use Open Anyway / right-click Open. Do NOT clear quarantine as the product fix. Not suitable for public distribution."
            exit 0
          fi
          echo "::error::Stable Studio Mac releases for 1.0.7 still require distribution_mode: internal-unsigned until Apple Developer ID secrets (MAC_CSC_LINK + MAC_CSC_KEY_PASSWORD) are configured (Workstream A2 gated). Do not select signed for Mac until that credential checkpoint completes."
          exit 1

      - name: Build Studio renderer/main once
        working-directory: apps/studio
        run: |
          set -euo pipefail
          # Produce dist/ + dist-electron/ without packaging so each arch package reuses the same build.
          node scripts/generate-packaged-build-config.mjs
          npx tsc
          npx vite build

      - name: Package Mac arm64 + x64 (native per-arch sharp) and merge updater metadata
        shell: bash
        working-directory: apps/studio
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          OUT_ROOT="release/${VERSION}"
          STAGING="release-staging"
          mkdir -p "$STAGING/arm64" "$STAGING/x64"
          HOST_ARCH=$(uname -m)
          echo "macos-latest host_arch=${HOST_ARCH} (GitHub macos-latest is currently arm64; x64 is cross-packaged)"

          for ARCH in arm64 x64; do
            echo "::group::Prepare sharp + package Mac ${ARCH}"
            node scripts/prepare-sharp-for-darwin-arch.mjs "$ARCH"
            npx electron-builder --mac "--${ARCH}" --publish never
            DMG="Fresh-Prints-Mac-${ARCH}-${VERSION}-Installer.dmg"
            ZIP="Fresh-Prints-Mac-${ARCH}-${VERSION}-Installer.zip"
            test -f "${OUT_ROOT}/${DMG}"
            test -f "${OUT_ROOT}/${ZIP}"
            test -f "${OUT_ROOT}/latest-mac.yml"
            if grep -q ' ' <<<"$DMG$ZIP"; then
              echo "::error::Mac artifact names must not contain spaces"
              exit 1
            fi
            cp "${OUT_ROOT}/${DMG}" "${OUT_ROOT}/${ZIP}" "${OUT_ROOT}/latest-mac.yml" "$STAGING/${ARCH}/"
            # Per-arch sharp + Electron arch proof
            rm -rf "$STAGING/${ARCH}/unpacked"
            unzip -q "${OUT_ROOT}/${ZIP}" -d "$STAGING/${ARCH}/unpacked"
            APP_PATH=$(find "$STAGING/${ARCH}/unpacked" -maxdepth 3 -name "*.app" -type d | head -n1)
            test -n "$APP_PATH"
            node scripts/verify-packaged-mac-sharp.mjs "$APP_PATH" "$ARCH"
            # Structural codesign integrity (required). Packaging exit 0 / DMG / sharp are NOT substitutes.
            node scripts/verify-packaged-mac-codesign.mjs "$APP_PATH" adhoc
            # Big Sur floor recorded in Info.plist
            PLIST="$APP_PATH/Contents/Info.plist"
            if [ -f "$PLIST" ]; then
              MIN_VER=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST" 2>/dev/null || true)
              echo "LSMinimumSystemVersion=${MIN_VER:-unknown} for ${ARCH}"
              case "${MIN_VER}" in
                11.*|10.15*|10.14*|10.13*) ;;
                "")
                  echo "::warning::LSMinimumSystemVersion missing from Info.plist for ${ARCH}"
                  ;;
                12.*|13.*|14.*|15.*)
                  echo "::error::minimumSystemVersion ${MIN_VER} is above Big Sur; Intel Big Sur 11.7.11 must remain supported"
                  exit 1
                  ;;
              esac
            fi
            shasum -a 256 "${OUT_ROOT}/${DMG}" "${OUT_ROOT}/${ZIP}" | tee "$STAGING/${ARCH}/sha256-macos-${ARCH}.txt"
            echo "::endgroup::"
          done

          node scripts/merge-latest-mac-yml.mjs \
            "$STAGING/arm64/latest-mac.yml" \
            "$STAGING/x64/latest-mac.yml" \
            "$OUT_ROOT/latest-mac.yml"
          cp "$OUT_ROOT/latest-mac.yml" "$STAGING/latest-mac.yml"

          # Stage canonical artifacts into release dir (exact names, no spaces).
          cp "$STAGING/arm64/"*.dmg "$STAGING/arm64/"*.zip "$OUT_ROOT/"
          cp "$STAGING/x64/"*.dmg "$STAGING/x64/"*.zip "$OUT_ROOT/"
          cp "$STAGING/arm64/"sha256-macos-arm64.txt "$STAGING/x64/"sha256-macos-x64.txt "$OUT_ROOT/"

          echo "Mac dual-arch package OK version=${VERSION}"
          ls -la "$OUT_ROOT"

      - name: Upload Mac package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studio-macos-${{ github.run_id }}
          path: |
            apps/studio/release/**
            apps/studio/release-staging/**
          retention-days: 14
          if-no-files-found: error

  finalize-release:
    name: finalize-release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed if platform SHAs diverge
        shell: bash
        run: |
          set -euo pipefail
          WIN_SHA="${{ needs.build-windows.outputs.build_sha }}"
          MAC_SHA="${{ needs.build-macos.outputs.build_sha }}"
          WIN_VER="${{ needs.build-windows.outputs.studio_version }}"
          MAC_VER="${{ needs.build-macos.outputs.studio_version }}"
          echo "windows_sha=$WIN_SHA mac_sha=$MAC_SHA"
          echo "windows_version=$WIN_VER mac_version=$MAC_VER"
          if [ -z "$WIN_SHA" ] || [ -z "$MAC_SHA" ]; then
            echo "::error::Missing build SHA outputs from platform jobs."
            exit 1
          fi
          if [ "$WIN_SHA" != "$MAC_SHA" ]; then
            echo "::error::Windows and Mac builds resolved different SHAs. Refusing to finalize a mixed-SHA release."
            exit 1
          fi
          if [ "$WIN_VER" != "$MAC_VER" ]; then
            echo "::error::Windows and Mac Studio package.json versions differ ($WIN_VER vs $MAC_VER)."
            exit 1
          fi
          if [ "$WIN_VER" != "1.0.7" ]; then
            echo "::error::Expected Studio version 1.0.7 for this release workflow. Got: $WIN_VER"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-windows.outputs.build_sha }}
          fetch-depth: 0

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: studio-windows-${{ github.run_id }}
          path: artifacts/windows

      - name: Download Mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: studio-macos-${{ github.run_id }}
          path: artifacts/macos

      - name: Verify required dual-platform assets (and draft only when stable+production)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          BUILD_SHA: ${{ needs.build-windows.outputs.build_sha }}
          VERSION: ${{ needs.build-windows.outputs.studio_version }}
        run: |
          set -euo pipefail
          WIN_DIR=$(find artifacts/windows -type d -name "$VERSION" | head -n1)
          MAC_DIR=$(find artifacts/macos -type d -name "$VERSION" | head -n1)
          test -n "$WIN_DIR"
          test -n "$MAC_DIR"

          # Canonical, space-free names — do not wildcard-match Fresh.Prints-* mistakes.
          WIN_EXE="$WIN_DIR/Fresh-Prints-Windows-${VERSION}-Setup.exe"
          WIN_BLOCKMAP="$WIN_DIR/Fresh-Prints-Windows-${VERSION}-Setup.exe.blockmap"
          WIN_YML="$WIN_DIR/latest.yml"
          MAC_ARM64_DMG="$MAC_DIR/Fresh-Prints-Mac-arm64-${VERSION}-Installer.dmg"
          MAC_ARM64_ZIP="$MAC_DIR/Fresh-Prints-Mac-arm64-${VERSION}-Installer.zip"
          MAC_X64_DMG="$MAC_DIR/Fresh-Prints-Mac-x64-${VERSION}-Installer.dmg"
          MAC_X64_ZIP="$MAC_DIR/Fresh-Prints-Mac-x64-${VERSION}-Installer.zip"
          MAC_YML="$MAC_DIR/latest-mac.yml"

          REQUIRED=(
            "$WIN_EXE" "$WIN_BLOCKMAP" "$WIN_YML"
            "$MAC_ARM64_DMG" "$MAC_ARM64_ZIP"
            "$MAC_X64_DMG" "$MAC_X64_ZIP"
            "$MAC_YML"
          )
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required dual-platform release asset: $f"
              exit 1
            fi
            base="$(basename "$f")"
            if [[ "$base" == *" "* ]]; then
              echo "::error::Asset name contains spaces (unsafe for GitHub Releases): $base"
              exit 1
            fi
            if [[ "$base" == Fresh.Prints-* ]]; then
              echo "::error::Rejecting GitHub-normalized dotted product name: $base"
              exit 1
            fi
          done

          # Updater metadata must reference arch-explicit Mac ZIP names and the Windows exe.
          grep -F "Fresh-Prints-Windows-${VERSION}-Setup.exe" "$WIN_YML"
          grep -F "Fresh-Prints-Mac-arm64-${VERSION}-Installer.zip" "$MAC_YML"
          grep -F "Fresh-Prints-Mac-x64-${VERSION}-Installer.zip" "$MAC_YML"
          if grep -E 'Fresh Prints-|Fresh\.Prints-' "$WIN_YML" "$MAC_YML"; then
            echo "::error::Updater metadata still references spaced or dotted Fresh Prints names"
            exit 1
          fi

          printf '%s\n' \
            "Fresh-Prints-Windows-${VERSION}-Setup.exe" \
            "Fresh-Prints-Windows-${VERSION}-Setup.exe.blockmap" \
            "latest.yml" \
            "Fresh-Prints-Mac-arm64-${VERSION}-Installer.dmg" \
            "Fresh-Prints-Mac-arm64-${VERSION}-Installer.zip" \
            "Fresh-Prints-Mac-x64-${VERSION}-Installer.dmg" \
            "Fresh-Prints-Mac-x64-${VERSION}-Installer.zip" \
            "latest-mac.yml" \
            | tee canonical-asset-names.txt

          echo "ARTIFACT_VERIFY_OK sha=${BUILD_SHA} version=${VERSION}"

          # Hard gate: non-stable runs are validation-only and must never mutate GitHub Releases.
          if [ "$RELEASE_TYPE" != "stable" ]; then
            echo "VALIDATION_ONLY: release_type=${RELEASE_TYPE} — skipping GitHub Release create/upload/mutate"
            echo "VALIDATION_ONLY_NO_RELEASE_MUTATION=1" | tee validation-mode.txt
            exit 0
          fi

          git fetch origin production --depth=1000
          if ! git merge-base --is-ancestor "$BUILD_SHA" origin/production; then
            echo "::error::Stable finalize requires BUILD_SHA to be reachable from origin/production. Refusing GitHub Release mutation for ${BUILD_SHA}."
            exit 1
          fi

          TAG="v${VERSION}"
          SHORT_SHA="$(echo "$BUILD_SHA" | cut -c1-7)"
          # Prefer an existing draft already pinned to this exact build SHA (any tag).
          # Do NOT match historical drafts by tag/name alone (369361779 / accidental branch drafts).
          RELEASE_ID="$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.draft == true and .target_commitish == \"$BUILD_SHA\") | .id" \
            | head -n1 || true)"

          if [ -z "$RELEASE_ID" ]; then
            # Avoid tag collisions with older drafts that still claim tag_name=vX.Y.Z.
            # `gh release upload <tag>` is ambiguous when multiple drafts share a tag_name;
            # we upload by release ID below, but creation still needs a unique tag_name.
            TAG_IN_USE="$(gh api "repos/${{ github.repository }}/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1 || true)"
            CREATE_TAG="$TAG"
            if [ -n "$TAG_IN_USE" ]; then
              CREATE_TAG="${TAG}-${SHORT_SHA}"
              echo "::warning::Tag ${TAG} already used by release ${TAG_IN_USE}; creating draft with unique tag ${CREATE_TAG} (name remains ${VERSION})."
            fi
            RELEASE_ID="$(gh api --method POST "repos/${{ github.repository }}/releases" \
              -f tag_name="$CREATE_TAG" \
              -f name="$VERSION" \
              -f target_commitish="$BUILD_SHA" \
              -F draft=true \
              -F prerelease=false \
              -f body="Fresh Prints Studio ${VERSION} (Windows + Mac x64 + Mac arm64). DRAFT — do not publish until dual-platform smoke passes. Build ${BUILD_SHA}." \
              --jq '.id')"
          fi

          RELEASE_META="$(gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}")"
          AFTER="$(echo "$RELEASE_META" | jq -r '.target_commitish')"
          DRAFT="$(echo "$RELEASE_META" | jq -r '.draft')"
          UPLOAD_TAG="$(echo "$RELEASE_META" | jq -r '.tag_name')"
          UPLOAD_URL="$(echo "$RELEASE_META" | jq -r '.upload_url' | sed 's/{?name,label}//')"
          if [ "$AFTER" != "$BUILD_SHA" ]; then
            echo "::error::Failed to pin draft target_commitish. expected=${BUILD_SHA} actual=${AFTER}"
            exit 1
          fi
          if [ "$DRAFT" != "true" ]; then
            echo "::error::Release ${RELEASE_ID} is not draft=true. Refusing to attach assets to a non-draft release."
            exit 1
          fi
          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
            echo "::error::Missing upload_url for release ${RELEASE_ID}"
            exit 1
          fi

          # Replace prior assets on this same-SHA draft only (never touch other drafts).
          EXISTING_ASSETS="$(gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets")"
          while read -r asset_id; do
            if [ -n "$asset_id" ] && [ "$asset_id" != "null" ]; then
              gh api --method DELETE "repos/${{ github.repository }}/releases/assets/${asset_id}" >/dev/null
            fi
          done < <(echo "$EXISTING_ASSETS" | jq -r '.[].id')

          # Upload by release ID / upload_url — NEVER by ambiguous shared tag_name (v1.0.4
          # collisions previously attached assets to the wrong draft).
          upload_release_asset() {
            local file="$1"
            local name
            name="$(basename "$file")"
            echo "Uploading ${name} -> release_id=${RELEASE_ID}"
            HTTP_CODE=$(curl -sS -o /tmp/gh-asset-upload.json -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${file}" \
              "${UPLOAD_URL}?name=${name}")
            if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Asset upload failed for ${name} http=${HTTP_CODE}"
              cat /tmp/gh-asset-upload.json || true
              exit 1
            fi
          }

          upload_release_asset "$WIN_EXE"
          upload_release_asset "$WIN_BLOCKMAP"
          upload_release_asset "$WIN_YML"
          upload_release_asset "$MAC_ARM64_DMG"
          upload_release_asset "$MAC_ARM64_ZIP"
          upload_release_asset "$MAC_X64_DMG"
          upload_release_asset "$MAC_X64_ZIP"
          upload_release_asset "$MAC_YML"

          ASSETS_JSON="$(gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets")"
          echo "$ASSETS_JSON" | jq -r '.[].name' | tee draft-asset-names.txt
          while read -r required; do
            if ! grep -Fxq "$required" draft-asset-names.txt; then
              echo "::error::Draft release missing required asset after upload: $required"
              exit 1
            fi
            if [[ "$required" == Fresh.Prints-* ]] || [[ "$required" == *" "* ]]; then
              echo "::error::Rejecting legacy/spaced asset name on draft: $required"
              exit 1
            fi
          done < canonical-asset-names.txt

          echo "FINALIZE_OK release_id=${RELEASE_ID} tag=${UPLOAD_TAG} sha=${BUILD_SHA} draft=true"
          echo "This workflow does NOT publish the release. Owner publication remains a separate human checkpoint."

      - name: Upload combined evidence
        uses: actions/upload-artifact@v4
        with:
          name: studio-release-evidence-${{ github.run_id }}
          path: |
            artifacts/windows/**/latest.yml
            artifacts/windows/**/*.blockmap
            artifacts/windows/**/sha256*.txt
            artifacts/macos/**/latest-mac.yml
            artifacts/macos/**/sha256*.txt
            canonical-asset-names.txt
            draft-asset-names.txt
            validation-mode.txt
          retention-days: 90
          if-no-files-found: warn
