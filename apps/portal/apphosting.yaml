# Settings for Cloud Run — tune in later slices.

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# Production (fresh-prints-prod) Portal web config.
# Values live in Cloud Secret Manager (not committed). Create/update with:
#   firebase apphosting:secrets:set <SECRET_NAME> --project fresh-prints-prod
# Grant backend access if secrets were created outside that flow:
#   firebase apphosting:secrets:grantaccess <SECRET_NAME> --backend fresh-prints-portal --project fresh-prints-prod
# Source of truth for local production builds: gitignored apps/portal/.env.production.local
# NEXT_PUBLIC_* are browser-exposed by design (not cryptographic secrets).
# NEXT_PUBLIC_GA_MEASUREMENT_ID is deliberately omitted — GA4 go-live is a separate checkpoint.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    secret: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_PORTAL_ORIGIN
    secret: NEXT_PUBLIC_PORTAL_ORIGIN
    availability:
      - BUILD
      - RUNTIME
  # Algolia managed catalog search (Gate C-enable). Search-only key — never admin.
  # Values: flag true; App ID Z1FVCM5QUX; index portal_catalog_ready_prod (not _dev).
  - variable: NEXT_PUBLIC_USE_ALGOLIA_CATALOG_SEARCH
    secret: NEXT_PUBLIC_USE_ALGOLIA_CATALOG_SEARCH
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_ALGOLIA_APP_ID
    secret: NEXT_PUBLIC_ALGOLIA_APP_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY
    secret: NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_ALGOLIA_INDEX_NAME
    secret: NEXT_PUBLIC_ALGOLIA_INDEX_NAME
    availability:
      - BUILD
      - RUNTIME
