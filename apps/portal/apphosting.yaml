# Settings for Cloud Run — tune in later slices.

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# Production (fresh-prints-prod) Portal web config. All NEXT_PUBLIC_* values here are
# browser-exposed by design, not secrets. NEXT_PUBLIC_GA_MEASUREMENT_ID is deliberately
# omitted — GA4 go-live is its own separate, later production-release checkpoint.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBE9IAFfLwmnanQ4yUxuTtgIT3yTleIvYc
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: fresh-prints-prod.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: fresh-prints-prod
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: fresh-prints-prod.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "473623863375"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:473623863375:web:524ec1a63f547e4d85ca3a"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: BKQeXm_CCwq82lELOIw1pgZMVwsS-ppyw3_E4ChxeQbTpQik3ffHCRhch1zqd36ipvkAIX-peh6JWgireT1ANPU
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_PORTAL_ORIGIN
    value: https://myprintrequest.com
    availability:
      - BUILD
      - RUNTIME

# This repo is an npm-workspaces monorepo (single package-lock.json at the repo root; apps/portal
# has no lock file of its own, which is correct npm-workspace behavior). Firebase App Hosting's
# buildpack only has first-class monorepo support for Nx/Turborepo and expects a lock file inside
# rootDir, so the default build fails with "Missing dependency lock file". buildCommand/runCommand
# both execute from /workspace (the full repo checkout), not rootDir, so they can install/build
# from the actual workspace root. NOTE: setting buildCommand disables the Next.js framework
# adapter's automatic optimizations for this backend — an accepted, deliberate tradeoff to unblock
# deployment on this repo's monorepo layout.
buildCommand: npm ci && npm run build --workspace=apps/portal
runCommand: npm run start --workspace=apps/portal
